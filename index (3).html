<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --wine-deep:#000000; --wine:#060507; --wine-mid:#17110a;
  --gold:#e6b84f; --gold-hi:#ffe2a0; --sky:#a9d4ff; --rose:#ff9db8; --ink:#ffffff; --muted:#e9e9ec;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:var(--sans);color:var(--ink);
  background:
    radial-gradient(60% 45% at 50% 42%,rgba(230,184,79,.13),transparent 70%),
    radial-gradient(95% 70% at 50% 40%,var(--wine-mid) 0%,var(--wine) 50%,var(--wine-deep) 100%);
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  display:flex;flex-direction:column;
}
header{display:flex;justify-content:space-between;align-items:baseline;padding:26px 28px 0}
h1{margin:0;font:600 1.7rem var(--serif);letter-spacing:.01em;
  color:#fff}
#clock{font:500 .95rem var(--sans);color:var(--muted);text-align:right}
#status{text-align:center;font-size:1rem;color:#fff;min-height:1.5em;margin-top:18px;transition:color .3s}
#status.on{color:#fff;text-shadow:0 0 12px rgba(230,184,79,.55)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;gap:6px}
#orb{
  position:relative;width:min(96vw,48vh,480px);aspect-ratio:1;border:0;padding:0;background:none;border-radius:50%;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#orb:focus-visible{outline:3px solid var(--gold);outline-offset:-12px}
#orb[disabled]{cursor:default}
canvas{width:100%;height:100%;display:block}
#orb svg{position:absolute;left:50%;top:50%;width:11%;height:11%;transform:translate(-50%,-50%);pointer-events:none;color:#fff;opacity:.9;transition:opacity .2s}
#orb .stop{opacity:0}
#orb.rec .mic{opacity:0}
#orb.rec .stop{opacity:1;color:#fff}
#panel{
  width:min(92vw,540px);min-height:72px;max-height:21vh;overflow-y:auto;margin:0 0 6px;
  padding:16px 20px;border-radius:22px;
  background:linear-gradient(135deg,rgba(230,184,79,.12),rgba(230,184,79,.03));
  border:1px solid rgba(230,184,79,.4);
  font-size:1.1rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#panel.hint{color:var(--muted);border-color:rgba(255,255,255,.1)}
#panel.err{color:#ffc9c9;border-color:rgba(255,120,120,.55);background:rgba(255,90,90,.1)}
footer{display:flex;justify-content:center;gap:24px;padding:4px 0 24px}
footer button{background:none;border:0;color:var(--muted);font:500 .9rem var(--sans);padding:10px;cursor:pointer;text-decoration:underline;text-underline-offset:4px}
footer button:hover,footer button:focus-visible{color:var(--gold-hi);outline:0}
#gate{position:fixed;inset:0;z-index:5;background:linear-gradient(var(--wine),var(--wine-deep));display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center}
#gate h2{margin:0;font:600 1.8rem var(--serif)}
#gate p{margin:0;color:var(--muted);line-height:1.5;max-width:30ch}
#gate input{width:min(86vw,340px);font:500 1.1rem var(--sans);text-align:center;padding:15px;color:var(--ink);background:rgba(255,255,255,.07);border:1px solid rgba(230,184,79,.45);border-radius:14px}
#gate input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#gate button{font:600 1rem var(--sans);padding:15px 38px;color:var(--wine-deep);background:linear-gradient(135deg,var(--gold-hi),var(--gold));border:0;border-radius:14px;cursor:pointer;box-shadow:0 0 22px rgba(230,184,79,.4)}
@media (prefers-reduced-motion:no-preference){ main{animation:in .8s ease-out both} @keyframes in{from{opacity:0;transform:translateY(10px)}} }
</style>
</head>
<body>
<header>
  <h1>Jarvis</h1>
  <div id="clock"><span id="time">--:--</span> · <span id="date"></span></div>
</header>
<div id="status" role="status">Tippe zum Sprechen</div>

<main>
  <button id="orb" type="button" aria-label="Aufnahme starten oder beenden">
    <canvas id="cv"></canvas>
    <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    <svg class="stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
  </button>
  <div id="panel" class="hint" aria-live="polite">Tippe auf das Licht, sprich und tippe nochmal zum Senden.</div>
</main>

<footer>
  <button id="replay" type="button" hidden>Nochmal abspielen</button>
  <button id="change" type="button">Schlüssel ändern</button>
</footer>

<form id="gate" onsubmit="return false">
  <h2>Jarvis</h2>
  <p>Gib deinen Schlüssel ein. Er wird nur auf diesem Gerät gespeichert.</p>
  <input id="key" type="password" autocomplete="off" placeholder="Schlüssel" aria-label="Schlüssel">
  <button id="save" type="button">Freigeben</button>
</form>

<script>
const WEBHOOK = "https://jarvis-marten.app.n8n.cloud/webhook/jarvis";
const $ = id => document.getElementById(id);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const player = new Audio();
let key = "", rec = null, chunks = [], stream = null, busy = false;
let ac = null, an = null, fd = null, srcNode = null, typer = null;
let state = "idle";

const LABEL = {
  idle:"Tippe zum Sprechen", rec:"Ich höre zu – tippe zum Senden",
  think:"Einen Moment …", speak:"Jarvis antwortet"
};
function setState(s){
  state = s; $("status").textContent = LABEL[s];
  $("status").classList.toggle("on", s !== "idle");
  $("orb").classList.toggle("rec", s === "rec");
}
function getKey(){ try { return localStorage.getItem("jarvis-key") || ""; } catch(e){ return ""; } }
function setKey(v){ try { v ? localStorage.setItem("jarvis-key", v) : localStorage.removeItem("jarvis-key"); } catch(e){} }
function showGate(on){ $("gate").style.display = on ? "flex" : "none"; $("orb").disabled = on; }

function say(text, cls, instant){
  clearInterval(typer);
  const p = $("panel"); p.className = cls || ""; p.textContent = "";
  if (instant || RM){ p.textContent = text; return; }
  let i = 0;
  typer = setInterval(() => {
    p.textContent = text.slice(0, ++i); p.scrollTop = p.scrollHeight;
    if (i >= text.length) clearInterval(typer);
  }, 14);
}
function tick(){
  const d = new Date();
  $("time").textContent = d.toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
  $("date").textContent = d.toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
}
tick(); setInterval(tick, 10000);

/* ---------- Aufnahme ---------- */
function pickMime(){
  return ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
}
async function start(){
  try{ stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ say("Kein Zugriff auf das Mikrofon. Erlaube es in den Browser-Einstellungen und lade die Seite neu.", "err", true); return; }
  try{
    ac = new (window.AudioContext || window.webkitAudioContext)(); await ac.resume();
    srcNode = ac.createMediaStreamSource(stream); an = ac.createAnalyser(); an.fftSize = 256;
    srcNode.connect(an); fd = new Uint8Array(an.frequencyBinCount);
  }catch(e){ an = null; }
  const mime = pickMime();
  rec = new MediaRecorder(stream, mime ? {mimeType:mime} : undefined);
  chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = send;
  rec.start();
  setState("rec"); say("…", "hint", true);
}
function stop(){
  if (rec && rec.state !== "inactive") rec.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  an = null; if (ac){ ac.close().catch(()=>{}); ac = null; }
}
async function send(){
  const type = (rec.mimeType || "audio/webm").split(";")[0];
  const blob = new Blob(chunks, {type});
  if (blob.size < 1500){ setState("idle"); say("Die Aufnahme war zu kurz. Versuch es nochmal.", "err", true); return; }
  busy = true; $("orb").disabled = true; setState("think");
  const form = new FormData();
  form.append("data", blob, "aufnahme." + (type.includes("mp4") ? "mp4" : "webm"));
  try{
    const r = await fetch(WEBHOOK, {method:"POST", headers:{"x-jarvis-key":key}, body:form});
    if (r.status === 401 || r.status === 403){ setKey(""); showGate(true); setState("idle"); return; }
    if (!r.ok) throw new Error("Status " + r.status);
    const j = await r.json();
    say(j.text || "(keine Antwort)");
    if (j.audio){ player.src = "data:audio/mpeg;base64," + j.audio; $("replay").hidden = false; speak(); }
    else setState("idle");
  }catch(e){
    say("Verbindung fehlgeschlagen (" + e.message + "). Prüfe, ob der Workflow veröffentlicht ist, und versuch es nochmal.", "err", true);
    setState("idle");
  }finally{ busy = false; $("orb").disabled = false; }
}
function speak(){
  setState("speak");
  player.play().catch(() => { setState("idle"); $("status").textContent = "Tippe auf „Nochmal abspielen“"; });
}
player.onended = () => setState("idle");

$("orb").addEventListener("click", () => {
  if (busy) return;
  if (state === "speak"){ player.pause(); setState("idle"); return; }
  (rec && rec.state === "recording") ? stop() : start();
});
$("replay").addEventListener("click", () => { player.currentTime = 0; speak(); });
$("change").addEventListener("click", () => { setKey(""); key = ""; $("key").value = ""; showGate(true); });
$("save").addEventListener("click", () => {
  const v = $("key").value.trim(); if (!v) return;
  key = v; setKey(v); showGate(false);
});

/* ---------- Lichtringe ---------- */
const cv = $("cv"), g = cv.getContext("2d");
let S = 0, lvlS = 0;
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = cv.height = Math.round(cv.clientWidth * dpr); S = cv.width;
}
addEventListener("resize", resize);

const GOLD=[255,205,110], BLUE=[169,212,255], ROSE=[255,150,184], LAV=[190,170,255], SKY=[120,170,255];
const RINGS = [
  {r:128, c1:BLUE,  c2:LAV,   ts:.50, tp:0,   r0:0,   rs:.10},
  {r:122, c1:SKY,   c2:BLUE,  ts:.38, tp:1.7, r0:1.2, rs:-.13},
  {r:134, c1:GOLD,  c2:ROSE,   ts:.44, tp:3.1, r0:2.4, rs:.08},
  {r:116, c1:GOLD,  c2:BLUE,   ts:.57, tp:4.4, r0:.6,  rs:-.07},
  {r:126, c1:LAV,   c2:ROSE, ts:.33, tp:5.6, r0:3.6, rs:.12}
];
const SEG = 72, TAU = 6.2832;
const DOTS = Array.from({length:46}, () => ({
  a:Math.random() * TAU, r:18 + Math.random() * 92, sp:(.04 + Math.random() * .12) * (Math.random() < .5 ? -1 : 1),
  ph:Math.random() * TAU, s:.8 + Math.random() * 1.8
}));

function level(t){
  if (state === "rec" && an){
    an.getByteFrequencyData(fd);
    let s = 0; for (let i = 2; i < 40; i++) s += fd[i];
    return Math.min(1, s / 38 / 150);
  }
  if (state === "speak") return .3 + .35 * Math.abs(Math.sin(t * 6.2) * Math.sin(t * 2.3 + 1));
  if (state === "think") return .18 + .1 * Math.sin(t * 4);
  return .05 + .04 * Math.sin(t * 1.3);
}

function frame(now){
  const t = RM ? 4 : now / 1000, lvl = RM ? .08 : level(t);
  lvlS += (lvl - lvlS) * .16;
  const sp = state === "think" ? 2.6 : state === "rec" ? 1.5 : 1;
  const T = t * sp;
  g.setTransform(1,0,0,1,0,0); g.globalCompositeOperation = "source-over"; g.clearRect(0,0,S,S);
  g.translate(S/2, S/2); const k = S / 400; g.scale(k, k);
  g.globalCompositeOperation = "lighter"; g.lineCap = "butt";

  /* weicher Schein, unten bläulich wie Licht im Inneren */
  let gr = g.createRadialGradient(0, 38, 8, 0, 38, 150);
  gr.addColorStop(0, "rgba(230,170,70," + (.30 + .35 * lvlS) + ")"); gr.addColorStop(1, "rgba(230,170,70,0)");
  g.fillStyle = gr; g.fillRect(-200, -200, 400, 400);
  gr = g.createRadialGradient(0, 0, 60, 0, 0, 190);
  gr.addColorStop(0, "rgba(230,184,79,0)"); gr.addColorStop(.7, "rgba(230,184,79," + (.07 + .1 * lvlS) + ")"); gr.addColorStop(1, "rgba(230,184,79,0)");
  g.fillStyle = gr; g.fillRect(-200, -200, 400, 400);

  /* ineinander verschlungene Ringe */
  const gain = .72 + .6 * lvlS, wob = .02 + .09 * lvlS;
  RINGS.forEach((R, i) => {
    const f = .26 + .74 * Math.abs(Math.cos(T * R.ts + R.tp)), rot = R.r0 + T * R.rs, cr = Math.cos(rot), sr = Math.sin(rot);
    const P = [];
    for (let s = 0; s <= SEG; s++){
      const a = s / SEG * TAU, rr = R.r * (1 + wob * Math.sin(3 * a + T * 1.6 + i) + wob * .5 * Math.sin(5 * a - T * 2.1));
      const x = rr * Math.cos(a), y = rr * f * Math.sin(a);
      P.push([x * cr - y * sr, x * sr + y * cr]);
    }
    for (let s = 0; s < SEG; s++){
      const a = s / SEG * TAU;
      const al = (.3 + .7 * (.5 + .5 * Math.sin(a * 2 - T * 1.1 + i * 1.3))) * gain;
      const m = .5 + .5 * Math.sin(a - T * .5 + i), c = [0, 1, 2].map(n => Math.round(R.c1[n] * (1 - m) + R.c2[n] * m)).join(",");
      for (const [w, pa] of [[17, .06], [7, .15], [2.1, .9]]){
        g.lineWidth = w; g.strokeStyle = "rgba(" + c + "," + Math.min(1, al * pa) + ")";
        g.beginPath(); g.moveTo(P[s][0], P[s][1]); g.lineTo(P[s + 1][0], P[s + 1][1]); g.stroke();
      }
    }
  });

  /* goldene Funken im Inneren */
  DOTS.forEach(d => {
    const a = d.a + T * d.sp, r = d.r * (1 + .08 * lvlS * Math.sin(T * 3 + d.ph));
    const x = Math.cos(a) * r, y = Math.sin(a) * r * .8 + 14;
    const tw = .35 + .65 * Math.abs(Math.sin(T * 1.4 + d.ph));
    g.fillStyle = "rgba(255,208,140," + (tw * (.55 + .4 * lvlS)) + ")";
    g.beginPath(); g.arc(x, y, d.s, 0, TAU); g.fill();
  });

  requestAnimationFrame(frame);
}

resize();
key = getKey(); showGate(!key);
requestAnimationFrame(frame);
</script>
</body>
</html>
